spring:
  datasource:
    xa:
      properties:
        useInformationSchema: true
    # MySQL 数据源配置
    driver-class-name: com.mysql.cj.jdbc.Driver
    # [修改点] Host 改为容器名 mysql
    url: jdbc:mysql://mysql:3306/dream?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Australia/Melbourne
    # [修改点] 暂时用 root，除非你已经新建了 dream_user
    username: ${DB_USERNAME:epoch}
    password: ${DB_PASSWORD:}   # P2-1: externalized — inject via env (server: dream-app/.env)

  rabbitmq:
    # [保留] 因为你会去网页后台手动创建这个 vhost
    virtual-host: my_vhost
    # [修改点] Host 改为容器名 rabbitmq
    host: rabbitmq
    port: 5672
    # [修改点] 使用 Admin 用户
    username: ${RABBITMQ_USERNAME:epoch}
    password: ${RABBITMQ_PASSWORD:}   # P2-1: externalized — inject via env

  redis:
    # [修改点] Host 改为容器名 redis
    host: redis
    port: 6379
    # [修改点] 必须填写密码
    password: ${REDIS_PASSWORD:}       # P2-1: externalized — inject via env
    database: 0
    jedis:
      pool:
        max-active: 8
        max-wait: 1ms
        max-idle: 4
        min-idle: 0

  elasticsearch:
    # [修改点] Host 改为容器名 elasticsearch
    uris: http://elasticsearch:9200
    connection-timeout: 3s

  # 登录态存 Redis：应用重启/重新部署不掉线；30 天不活跃才过期（滑动续期）
  session:
    store-type: redis
    timeout: 30d
    redis:
      namespace: dream:session

  servlet:
    multipart:
      # keep ABOVE FileUtils caps (10MB image / 30MB attachment) — Spring rejects
      # oversize requests before any of our validation runs
      max-file-size: 30MB
      max-request-size: 40MB

server:
  port: 8088
  # Gzip responses before they enter the Cloudflare Tunnel. Measured: the season
  # stats endpoint ships 2.89MB of uncompressed JSON, and the app→edge hop was
  # carrying all of it — the edge compressed to ~390KB only on the way out to the
  # browser, so the tunnel moved 7x more bytes than it had to. SQL for the same
  # request is 17ms and the whole in-container round trip is 56ms, so the tunnel
  # is where the second-plus of latency lives.
  compression:
    enabled: true
    mime-types: application/json,application/javascript,text/javascript,text/css,text/html,text/plain,text/xml,image/svg+xml
    min-response-size: 2KB
  servlet:
    session:
      cookie:
        # 持久 cookie：关浏览器不丢登录态（配合上面的 30 天服务端 session）
        max-age: 30d
        http-only: true

cors:
  # P2-2: allowed origins for the future React client (Session + credentials).
  # Add localhost dev origins here too if you run React locally against this server.
  # Old domain (dream-app.the-epoch.org) now 301s to www at the Cloudflare edge — no longer an origin.
  allowed-origins: https://www.dream-everything.com,https://dream-everything.com

mybatis-plus:
  mapper-locations: classpath*:mybatis/*.xml
  type-aliases-package: com.dream.basketball.entity
  type-aliases-super-type: java.lang.Object

  configuration:
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: VARCHAR

  global-config:
    db-config:
      update-strategy: IGNORED

picPath:
  # [修改点] 必须改为 Linux 路径
  # 确保你已经在 Code-Server 里创建了这个文件夹：mkdir -p /config/workspace/uploads
  uploadPath: /config/workspace/uploads/
  picPath: /picImg/

# Web Push (RFC 8292 VAPID). Both halves come from the environment: the pair has to
# match, and splitting one into the repo and one into env is how they end up not
# matching. Absent -> WebPushSender logs a warning and quietly does nothing, so the
# app still starts on a machine that has no keys.
# Server: dream-app/.env
push:
  vapid:
    public-key: ${VAPID_PUBLIC_KEY:}
    private-key: ${VAPID_PRIVATE_KEY:}
    subject: mailto:bliuzzz1016@gmail.com

# Log to a file as well as stdout.
#
# Container stdout goes to Docker's json-file log, which is destroyed when the
# container is recreated -- and every deploy recreates it. So the log of anything
# that went wrong before the last deploy is gone, which is exactly when you want it.
# The file lives on a bind mount (./logs on the host), so it outlives deploys.
#
# Rotation is capped so this cannot fill the disk: 20MB per file, 14 files kept,
# 500MB total.
logging:
  file:
    name: /app/logs/dream-app.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB

